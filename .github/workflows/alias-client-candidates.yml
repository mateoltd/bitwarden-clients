name: Alias client OSS candidates

on:
  push:
    branches: [integration/public-alias-clients]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alias-client-candidates-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.17.0
  CLI_NODE_VERSION: 22.22.0
  NPM_VERSION: 11.18.0
  PYTHON_VERSION: 3.14.2
  SOURCE_DATE_EPOCH: 1786536436

jobs:
  policy:
    name: OSS boundary, secrets, locks, and licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global "npm@${NPM_VERSION}"
      - name: Verify release contract and SDK artifact
        run: npm run release:verify
      - name: Validate release workflows
        run: >-
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo
          docker.io/rhysd/actionlint:1.7.10@sha256:ef8299f97635c4c30e2298f48f30763ab782a4ad2c95b744649439a039421e36
          -color=false
          .github/workflows/alias-client-candidates.yml
          .github/workflows/alias-clean-room-rebuild.yml
          .github/workflows/alias-headed-e2e.yml
          .github/workflows/alias-upstream-drift.yml
      - name: Export only OSS source and dependencies
        run: |
          scripts/release/export-oss-source.sh "$RUNNER_TEMP/source"
      - name: Scan tracked OSS source for secrets
        run: >-
          docker run --rm --volume "$RUNNER_TEMP/source:/repo:ro"
          docker.io/zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir /repo --no-banner --redact --config=/repo/.gitleaks.toml
      - name: Install locked OSS dependencies
        run: |
          cd "$RUNNER_TEMP/source"
          HUSKY=0 npm ci
          npm ci --prefix release/tooling
      - name: Enforce license policy
        run: |
          cd "$RUNNER_TEMP/source"
          npm run release:license-inventory -- --output license-inventory.json
          npm run release:license-check -- license-inventory.json --output release-license-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alias-release-policy
          path: |
            ${{ runner.temp }}/source/license-inventory.json
            ${{ runner.temp }}/source/release-license-report.json
          if-no-files-found: error

  browser:
    name: ${{ matrix.id }} build and launch
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: browser-chrome, runner: ubuntu-24.04, engine: chromium }
          - { id: browser-edge, runner: ubuntu-24.04, engine: chromium }
          - { id: browser-firefox-mv2, runner: ubuntu-24.04, engine: firefox }
          - { id: browser-firefox-mv3, runner: ubuntu-24.04, engine: firefox }
          - { id: browser-opera, runner: ubuntu-24.04, engine: chromium }
          - { id: browser-safari-mv2, runner: macos-15, engine: safari }
          - { id: browser-safari-mv3, runner: macos-15, engine: safari }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with: { node-version: 24.17.0, cache: npm }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: { python-version: 3.14.2 }
      - run: npm install --global npm@11.18.0
      - name: Prepare OSS clean room
        run: |
          scripts/release/export-oss-source.sh "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"
          HUSKY=0 npm ci
          npm ci --prefix release/tooling
      - name: Install browser runtime
        if: runner.os == 'Linux'
        run: |
          cd "$RUNNER_TEMP/source"
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Build candidate
        run: |
          cd "$RUNNER_TEMP/source"
          OSS_CLEAN_ROOM=1 npm run release:build -- ${{ matrix.id }} --output release-out
      - name: Install and launch candidate
        run: |
          cd "$RUNNER_TEMP/source"
          candidate="$(find release-out -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -quit)"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a npm run release:smoke -- ${{ matrix.id }} "$candidate"
          else
            npm run release:smoke -- ${{ matrix.id }} "$candidate"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.id }}
          path: ${{ runner.temp }}/source/release-out/*
          compression-level: 0
          if-no-files-found: error

  desktop:
    name: ${{ matrix.id }} build and launch
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: desktop-linux-x64, runner: ubuntu-22.04 }
          - { id: desktop-linux-arm64, runner: ubuntu-24.04-arm }
          - { id: desktop-macos-x64, runner: macos-15-intel }
          - { id: desktop-macos-arm64, runner: macos-15 }
          - { id: desktop-windows-x64, runner: windows-2022 }
          - { id: desktop-windows-arm64, runner: windows-11-arm }
          - { id: desktop-windows-ia32, runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with: { node-version: 24.17.0, cache: npm }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: matrix.id != 'desktop-windows-arm64'
        with: { python-version: 3.14.2 }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: matrix.id == 'desktop-windows-arm64'
        with:
          python-version: 3.14.2
          architecture: x64
      - run: npm install --global npm@11.18.0
      - name: Install Linux build and launch dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          audio_package=libasound2
          if apt-cache show libasound2t64 >/dev/null 2>&1; then audio_package=libasound2t64; fi
          sudo apt-get install --yes pkg-config libxss-dev "$audio_package" xvfb
      - name: Prepare OSS clean room
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then root="$(cygpath -u "$RUNNER_TEMP")"; else root="$RUNNER_TEMP"; fi
          scripts/release/export-oss-source.sh "$root/source"
          cd "$root/source"
          HUSKY=0 npm ci
      - name: Build candidate
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then root="$(cygpath -u "$RUNNER_TEMP")"; else root="$RUNNER_TEMP"; fi
          cd "$root/source"
          OSS_CLEAN_ROOM=1 npm run release:build -- ${{ matrix.id }} --output release-out
      - name: Install and launch candidate
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then root="$(cygpath -u "$RUNNER_TEMP")"; else root="$RUNNER_TEMP"; fi
          cd "$root/source"
          candidate="$(find release-out -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -quit)"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a npm run release:smoke -- ${{ matrix.id }} "$candidate"
          else
            npm run release:smoke -- ${{ matrix.id }} "$candidate"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.id }}
          path: ${{ runner.temp }}/source/release-out/*
          compression-level: 0
          if-no-files-found: error

  web:
    name: Web self-host candidate
    needs: policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with: { node-version: 24.17.0, cache: npm }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: { python-version: 3.14.2 }
      - run: npm install --global npm@11.18.0
      - run: |
          scripts/release/export-oss-source.sh "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"
          HUSKY=0 npm ci
          OSS_CLEAN_ROOM=1 npm run release:build -- web-selfhost --output release-out
          candidate="$(find release-out -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -quit)"
          npm run release:smoke -- web-selfhost "$candidate"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-web-selfhost
          path: ${{ runner.temp }}/source/release-out/*
          compression-level: 0
          if-no-files-found: error

  cli:
    name: ${{ matrix.id }} build and launch
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: cli-linux-x64, runner: ubuntu-22.04 }
          - { id: cli-linux-arm64, runner: ubuntu-24.04-arm }
          - { id: cli-macos-x64, runner: macos-15-intel }
          - { id: cli-macos-arm64, runner: macos-15 }
          - { id: cli-windows-x64, runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with: { node-version: 22.22.0, cache: npm }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: { python-version: 3.14.2 }
      - run: npm install --global npm@11.18.0
      - shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then root="$(cygpath -u "$RUNNER_TEMP")"; else root="$RUNNER_TEMP"; fi
          scripts/release/export-oss-source.sh "$root/source"
          cd "$root/source"
          HUSKY=0 npm ci
          OSS_CLEAN_ROOM=1 npm run release:build -- ${{ matrix.id }} --output release-out
          candidate="$(find release-out -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -quit)"
          npm run release:smoke -- ${{ matrix.id }} "$candidate"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.id }}
          path: ${{ runner.temp }}/source/release-out/*
          compression-level: 0
          if-no-files-found: error

  metadata:
    name: SBOM, provenance, source manifests, and hashes
    needs: [browser, desktop, web, cli]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with: { node-version: 24.17.0, cache: npm }
      - run: npm install --global npm@11.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-*
          path: candidates
          merge-multiple: true
      - name: Generate metadata
        run: |
          scripts/release/export-oss-source.sh "$RUNNER_TEMP/source"
          python3 scripts/release/archive.py --source "$RUNNER_TEMP/source" --output "candidates/bitwarden-alias-client-source-${GITHUB_SHA}.tar.gz" --format tar.gz --epoch "$SOURCE_DATE_EPOCH"
          cd "$RUNNER_TEMP/source"
          npm ci --prefix release/tooling
          release/tooling/node_modules/.bin/cyclonedx-npm --package-lock-only --ignore-npm-errors --output-reproducible --omit dev --mc-type application --output-file base.cdx.json
          npm run release:metadata -- --artifacts "$GITHUB_WORKSPACE/candidates" --sbom base.cdx.json --output release-metadata
          cp "$GITHUB_WORKSPACE/candidates/bitwarden-alias-client-source-${GITHUB_SHA}.tar.gz" release-metadata/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alias-release-metadata
          path: ${{ runner.temp }}/source/release-metadata/*
          if-no-files-found: error
