name: Alias headed provider E2E

on:
  push:
    branches: [integration/public-alias-clients]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alias-headed-e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.17.0
  NPM_VERSION: 11.18.0
  PYTHON_VERSION: 3.14.2
  PROVIDER_OPERATIONS_COMMIT: e157b6804f7b1b60e149207cebe2d414f6e4a73f
  PROVIDER_UPSTREAM_COMMIT: dbc45fcce4e8e6b4fa615cc729ca95a67bf75266
  VAULT_IMAGE: docker.io/vaultwarden/server:1.37.1@sha256:ebdfe70701c60ac0c28c697e787cea767d7972940b786037b29fe0d507f821e8

jobs:
  browser-and-desktop:
    name: Browser autofill and desktop lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out clients
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned real provider
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: mateoltd/simplelogin-owned-provider
          ref: e157b6804f7b1b60e149207cebe2d414f6e4a73f
          path: provider
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: { python-version: 3.14.2 }
      - run: npm install --global "npm@${NPM_VERSION}"
      - name: Verify pinned provider ancestry
        run: |
          test "$(git -C provider rev-parse HEAD)" = "$PROVIDER_OPERATIONS_COMMIT"
          test "$(tr -d '[:space:]' < provider/ops/owned-provider/UPSTREAM_COMMIT)" = "$PROVIDER_UPSTREAM_COMMIT"
          git -C provider merge-base --is-ancestor "$PROVIDER_UPSTREAM_COMMIT" "$PROVIDER_OPERATIONS_COMMIT"
      - name: Prepare OSS client source
        run: |
          scripts/release/export-oss-source.sh "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"
          HUSKY=0 npm ci
          chromium_path="$(node scripts/release/install-browser-runtime.mjs --output "$RUNNER_TEMP/playwright-chromium")"
          test -x "$chromium_path"
          echo "CHROMIUM_PATH=$chromium_path" >> "$GITHUB_ENV"
          "$chromium_path" --version
          sudo apt-get update
          audio_package=libasound2
          if apt-cache show libasound2t64 >/dev/null 2>&1; then audio_package=libasound2t64; fi
          sudo apt-get install --yes acl pkg-config libxss-dev "$audio_package" xvfb
      - name: Start pinned real provider
        run: |
          provider/ops/owned-provider/bin/owned-provider init
          provider_password="$(tr -d '\r\n' < provider/.owned-provider/secrets/admin_password)"
          echo "::add-mask::$provider_password"
          echo "SIMPLELOGIN_PASSWORD=$provider_password" >> "$GITHUB_ENV"
          restore_secret_acls() {
            find provider/.owned-provider/secrets -type f -exec setfacl -x u:65532 {} +
          }
          trap restore_secret_acls EXIT
          find provider/.owned-provider/secrets -type f -exec setfacl -m u:65532:r-- {} +
          provider/ops/owned-provider/bin/owned-provider up
          restore_secret_acls
          trap - EXIT
      - name: Start pinned ephemeral vault
        run: |
          mkdir -p "$RUNNER_TEMP/vault-data"
          chmod 777 "$RUNNER_TEMP/vault-data"
          docker run --detach --name alias-client-release-vault \
            --volume "$RUNNER_TEMP/vault-data:/data" \
            --publish 127.0.0.1:18080:80 \
            --env DOMAIN=https://localhost:18443 \
            --env SIGNUPS_ALLOWED=true \
            --env SIGNUPS_VERIFY=false \
            "$VAULT_IMAGE"
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:18080/alive >/dev/null; then break; fi
            if [[ "$attempt" == 60 ]]; then docker logs alias-client-release-vault; exit 1; fi
            sleep 1
          done
          cd "$RUNNER_TEMP/source"
          node scripts/release/vault-tls-proxy.mjs > "$RUNNER_TEMP/vault-tls-proxy.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --insecure --silent --fail https://localhost:18443/alive >/dev/null; then break; fi
            if [[ "$attempt" == 30 ]]; then cat "$RUNNER_TEMP/vault-tls-proxy.log"; exit 1; fi
            sleep 1
          done
          vault_password="$(openssl rand -base64 30 | tr -d '\r\n')"
          echo "::add-mask::$vault_password"
          {
            echo "BITWARDEN_PASSWORD=$vault_password"
            echo "BITWARDEN_EMAIL=alias-release-${GITHUB_RUN_ID}@mailbox.lan"
            echo "BITWARDEN_DB_PATH=$RUNNER_TEMP/vault-data/db.sqlite3"
          } >> "$GITHUB_ENV"
      - name: Bootstrap client-generated vault keys
        env:
          BITWARDEN_WEB_URL: https://localhost:18443
        run: |
          cd "$RUNNER_TEMP/source"
          node scripts/release/bootstrap-test-vault.mjs
      - name: Build headed test clients
        run: |
          cd "$RUNNER_TEMP/source"
          npx nx run browser:build --configuration=chrome-dev
          node apps/desktop/desktop_native/build.js --target=x86_64-unknown-linux-gnu --release
          npm run build --workspace apps/desktop
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync("apps/web/config/local.json", JSON.stringify({
              dev: {
                port: 8080,
                proxyApi: "http://127.0.0.1:18080/api",
                proxyIdentity: "http://127.0.0.1:18080/identity",
                proxyEvents: "http://127.0.0.1:18080/events",
                proxyNotifications: "http://127.0.0.1:18080/notifications",
                simpleLoginConnectSrc: "http://127.0.0.1:*"
              }
            }));
          '
          npx nx serve web --configuration=oss-dev --host=localhost --port=8080 \
            > "$RUNNER_TEMP/web.log" 2>&1 &
          for attempt in $(seq 1 120); do
            if curl --insecure --silent --fail https://localhost:8080/ >/dev/null; then break; fi
            if [[ "$attempt" == 120 ]]; then cat "$RUNNER_TEMP/web.log"; exit 1; fi
            sleep 1
          done
      - name: Browser create, autofill, lock, restart, and unlock
        env: &alias-e2e-environment
          BITWARDEN_API_URL: http://127.0.0.1:18080/api
          BITWARDEN_IDENTITY_URL: http://127.0.0.1:18080/identity
          BITWARDEN_DB_DIALECT: vaultwarden
          SIMPLELOGIN_URL: http://127.0.0.1:17777
          SIMPLELOGIN_EMAIL: admin@mailbox.lan
          SIMPLELOGIN_APP_CONTAINER: simplelogin-owned-provider-app-1
        run: |
          cd "$RUNNER_TEMP/source"
          xvfb-run -a node apps/browser/test/real-simple-login-alias.e2e.mjs
      - name: Desktop create, lock, restart, and unlock
        env: *alias-e2e-environment
        run: |
          cd "$RUNNER_TEMP/source"
          docker exec simplelogin-owned-provider-redis-1 redis-cli --scan --pattern 'LIMITS:*' |
            while IFS= read -r key; do
              docker exec simplelogin-owned-provider-redis-1 redis-cli DEL "$key" >/dev/null
            done
          xvfb-run -a node apps/desktop/test/real-simple-login-alias.e2e.mjs
      - name: Web alias lifecycle through the real application route
        env: *alias-e2e-environment
        run: |
          cd "$RUNNER_TEMP/source"
          docker exec simplelogin-owned-provider-redis-1 redis-cli --scan --pattern 'LIMITS:*' |
            while IFS= read -r key; do
              docker exec simplelogin-owned-provider-redis-1 redis-cli DEL "$key" >/dev/null
            done
          WEB_URL=https://localhost:8080 \
            xvfb-run -a node apps/web/test/real-simple-login-alias.e2e.mjs
      - name: Real provider, encrypted vault, and 10,000-record cross-device suites
        env:
          ALIAS_CROSS_DEVICE_INTEGRATION: "1"
          ALIAS_SYNC_FIXTURE_SIZE: "10000"
          BITWARDEN_API_URL: http://127.0.0.1:18080/api
          BITWARDEN_DB_DIALECT: vaultwarden
          BITWARDEN_IDENTITY_URL: http://127.0.0.1:18080/identity
          BITWARDEN_SERVER_INTEGRATION: "1"
          SIMPLELOGIN_BASE_URL: http://127.0.0.1:17777
          SIMPLELOGIN_DB_CONTAINER: simplelogin-owned-provider-postgres-1
          SIMPLELOGIN_EMAIL: admin@mailbox.lan
          SIMPLELOGIN_INTEGRATION: "1"
          SIMPLELOGIN_APP_CONTAINER: simplelogin-owned-provider-app-1
          SIMPLELOGIN_REDIS_CONTAINER: simplelogin-owned-provider-redis-1
          SIMPLELOGIN_URL: http://127.0.0.1:17777
        run: |
          cd "$RUNNER_TEMP/source"
          docker exec simplelogin-owned-provider-redis-1 redis-cli --scan --pattern 'LIMITS:*' |
            while IFS= read -r key; do
              docker exec simplelogin-owned-provider-redis-1 redis-cli DEL "$key" >/dev/null
            done
          npx jest --runInBand --runTestsByPath \
            libs/tools/generator/core/src/alias/simple-login-alias.integration.spec.ts \
            libs/tools/generator/core/src/alias/alias-binding-server.integration.spec.ts \
            apps/web/src/app/tools/email-aliases/email-aliases.integration.spec.ts \
            apps/desktop/src/app/tools/aliases/desktop-alias.integration.spec.ts \
            apps/cli/src/tools/alias-reconciliation/alias-reconciliation.integration.spec.ts
      - name: Real provider rate-limit classification
        env:
          SIMPLELOGIN_BASE_URL: http://127.0.0.1:17777
          SIMPLELOGIN_EMAIL: admin@mailbox.lan
          SIMPLELOGIN_INTEGRATION: "1"
          SIMPLELOGIN_RATE_LIMIT_INTEGRATION: "1"
        run: |
          cd "$RUNNER_TEMP/source"
          docker exec simplelogin-owned-provider-redis-1 redis-cli --scan --pattern 'LIMITS:*' |
            while IFS= read -r key; do
              docker exec simplelogin-owned-provider-redis-1 redis-cli DEL "$key" >/dev/null
            done
          npx jest --runInBand --runTestsByPath \
            libs/tools/generator/core/src/alias/simple-login-alias.integration.spec.ts
      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          docker logs alias-client-release-vault > diagnostics/vault.log 2>&1 || true
          docker logs simplelogin-owned-provider-app-1 > diagnostics/provider.log 2>&1 || true
          cp "$RUNNER_TEMP/web.log" diagnostics/web.log 2>/dev/null || true
          find /tmp -maxdepth 1 -name 'alias-*.png' -exec cp {} diagnostics/ \; || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: alias-headed-e2e-diagnostics
          path: diagnostics
          if-no-files-found: warn
